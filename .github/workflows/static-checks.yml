name: Static checks

# Runs on every push and pull request. These checks analyse the exported VBA
# sources as text and need no Excel, so they run on a hosted runner in seconds.
#
# One check needs git history: released changelog sections are compared against
# their content at the matching tag, so the checkout fetches tags.
#
# The run publishes a machine-readable result document as a workflow artifact,
# so a release can reference a verifiable run instead of a manual assertion.
#
# They cannot execute a single test. That is the job of the headless Excel
# regression gate tracked in #11, which requires a self-hosted Windows runner.
# What these checks do cover is the class of defect that reached this
# repository during v1.2.0: version drift, stale error sources, unbalanced
# procedure blocks, reserved-word identifiers, and committed conflict markers.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vba-lint:
    name: VBA source consistency
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Tags are required: the changelog check compares each released
          # section against its own content at that tag.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run static checks
        run: python3 tools/vba_lint.py --json vba-lint-results.json

      # Uploaded even when the checks fail, which is when the detail is most
      # useful. A release can then point at a run rather than at a recollection
      # that the checks were green.
      - name: Publish results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vba-lint-results
          path: vba-lint-results.json
          retention-days: 90
