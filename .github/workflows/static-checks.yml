name: Static checks

# Runs on every push and pull request. These checks analyse the exported VBA
# sources, CHANGELOG, workflow files and release tooling as text and need no
# Excel, so they run on a hosted runner in seconds.
#
# One check needs git history: released changelog sections are compared against
# their content at the matching tag, so the checkout fetches tags.
#
# The run publishes a machine-readable result document as a workflow artifact,
# so a release can reference a verifiable run instead of a manual assertion.
#
# They cannot execute a single test. That is the job of the headless Excel
# regression gate tracked in #11, which requires a self-hosted Windows runner.
# What these checks do cover are the defect classes found during development:
# version drift, stale error sources, unbalanced procedure blocks,
# reserved-word identifiers, committed conflict markers, compile-safety gaps
# (handler labels, undeclared assignments), released changelog drift,
# release-provenance contract violations, mutable workflow action pins, and
# the workflow hardening rules in tools/workflow_controls.py (#80). The Python
# tooling itself is held to Ruff, strict mypy and actionlint, and every
# tools/test_*.py module runs through unittest discovery (#81).
#
# The interpreter is pinned once, in .python-version. The minimum-python job
# pins the documented floor instead; it is informational, not a required check.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vba-lint:
    name: VBA source consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # actionlint release and the SHA-256 of its Linux x86_64 archive, as
      # published in the release's checksums file.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_LINUX_AMD64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are required: the changelog check compares each released
          # section against its own content at that tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install the hash-locked test and quality dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          -r tools/requirements-ci.txt -r tools/requirements-quality.txt

      - name: Install checksum-verified actionlint
        run: |
          dir="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          archive="${dir}/actionlint.tar.gz"
          mkdir -p "$dir"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --silent --show-error --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" | sha256sum --check --strict
          tar --no-same-owner -xzf "$archive" -C "$dir" actionlint
          echo "$dir" >> "$GITHUB_PATH"

      - name: Prepare pinned wiki input
        run: python tools/release_state.py --fetch-wiki --wiki-root "${RUNNER_TEMP}/performance-manager-wiki"

      - name: Run static checks
        run: python tools/vba_lint.py --wiki-root "${RUNNER_TEMP}/performance-manager-wiki" --json vba-lint-results.json

      - name: Lint the Python tools with Ruff
        run: ruff check --no-cache tools

      - name: Type-check the Python tools with strict mypy
        run: mypy --no-incremental

      - name: Lint the workflows with actionlint
        run: actionlint -no-color

      - name: Exercise Excel runner verdicts without Excel
        shell: pwsh
        run: ./tools/Test-ExcelRunnerVerdicts.ps1

      - name: Run the tool tests by discovery
        run: python -m unittest discover -s tools -p "test_*.py" -v

      # Uploaded even when the checks fail, which is when the detail is most
      # useful. A release can then point at a run rather than at a recollection
      # that the checks were green.
      - name: Publish results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vba-lint-results
          path: vba-lint-results.json
          retention-days: 90

  minimum-python:
    # Not a required check: it confirms that the tools still run on the
    # documented minimum Python version stated in README.md.
    name: Minimum Python (3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.18"

      - name: Install the hash-locked test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes -r tools/requirements-ci.txt

      - name: Prepare pinned wiki input
        run: python tools/release_state.py --fetch-wiki --wiki-root "${RUNNER_TEMP}/performance-manager-wiki"

      - name: Run static checks
        run: python tools/vba_lint.py --wiki-root "${RUNNER_TEMP}/performance-manager-wiki"

      - name: Run the tool tests by discovery
        run: python -m unittest discover -s tools -p "test_*.py" -v
